name: CrewMesh CI

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']
  workflow_dispatch:

env:
  NODE_ENV: test
  HOST: 127.0.0.1
  PORT: 3001
  APP_ORIGIN: http://localhost:5173
  DATABASE_URL: postgresql://crewmesh:crewmesh_ci_test_password@localhost:5432/crewmesh_test
  TEST_DATABASE_URL: postgresql://crewmesh:crewmesh_ci_test_password@localhost:5432/crewmesh_test
  DATABASE_SSL: disable
  DB_POOL_MAX: 25
  SESSION_COOKIE_NAME: crewmesh_session
  SESSION_TTL_HOURS: 168
  CSRF_SECRET: ci_test_csrf_secret_with_at_least_32_characters_of_random_entropy_2026
  TRUST_PROXY: 'false'
  SERVE_WEB_DIST: 'false'
  LOG_LEVEL: warn
  HACKATHON_SLUG: hack4hack-crew-2026
  HACKATHON_NAME: Hack4Hack Crew Hiring Challenge 2026
  HACKATHON_MIN_TEAM_SIZE: 2
  HACKATHON_MAX_TEAM_SIZE: 5
  HACKATHON_DEADLINE_ISO: ''

jobs:
  verify-and-test:
    name: PostgreSQL 16 API, 50-Way Race, SSE, Suggestions, Hardening, Build & Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crewmesh
          POSTGRES_PASSWORD: crewmesh_ci_test_password
          POSTGRES_DB: crewmesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crewmesh -d crewmesh_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify root package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error file=package-lock.json::Root package-lock.json is missing. Commit a real npm workspace lockfile so dependencies install deterministically via npm ci."
            exit 1
          fi

      - name: Install dependencies reproducibly via npm ci
        run: npm ci

      - name: Apply PostgreSQL migrations (001 through 007)
        run: npm run db:migrate

      - name: Verify migration 007 and 006 down and up rollback/reapply idempotency
        run: |
          npm run db:migrate:down
          npm run db:migrate:down
          npm run db:migrate

      - name: Seed Hack4Hack 2026 event configuration
        run: npm run db:seed

      - name: Run ESLint across all workspaces and scripts
        run: npm run lint

      - name: Run TypeScript typechecking across all workspaces
        run: npm run typecheck

      - name: Build shared, API, and Web production bundles
        run: npm run build

      - name: Run isolated unit and invariant tests (Batches 1–9)
        run: npm run test:unit:sandbox

      - name: Run PostgreSQL API, SSE, Suggestions, Scale Safety & Hardening integration suites
        run: npm run test:integration

      - name: Run 50-way last-seat concurrency & invite use-limit race proofs
        run: npm run test:race

      - name: Run Batch 7/8/9 security and concurrency hardening suite
        run: npm run test:hardening

      - name: Run frontend unit tests
        run: npm run test --workspace=@crewmesh/web

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Start API and Web preview servers and execute Playwright E2E browser tests (Desktop + 360px/390px Mobile)
        run: |
          npm run start --workspace=@crewmesh/api &
          API_PID=$!
          npm run preview --workspace=@crewmesh/web &
          WEB_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/ready >/dev/null && curl -sf http://localhost:5173/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:e2e
          kill $API_PID $WEB_PID || true

  scale-and-k6-benchmark:
    name: Batch 06–09 — 10k Participants, 2k Teams Scale Seed & 100-VU k6 Board Benchmark (p95 < 200ms)
    runs-on: ubuntu-latest
    needs: verify-and-test
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://crewmesh:crewmesh_ci_loadtest_password@localhost:5432/crewmesh_loadtest
      TEST_DATABASE_URL: postgresql://crewmesh:crewmesh_ci_loadtest_password@localhost:5432/crewmesh_loadtest
      CREWMESH_ALLOW_SCALE_SEED: 'true'
      DB_POOL_MAX: 40

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crewmesh
          POSTGRES_PASSWORD: crewmesh_ci_loadtest_password
          POSTGRES_DB: crewmesh_loadtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crewmesh -d crewmesh_loadtest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify root package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error file=package-lock.json::Root package-lock.json is missing. Commit a real npm workspace lockfile so dependencies install deterministically via npm ci."
            exit 1
          fi

      - name: Install dependencies reproducibly via npm ci
        run: npm ci

      - name: Apply PostgreSQL migrations (001 through 007) on isolated crewmesh_loadtest database
        run: npm run db:migrate

      - name: Seed Hack4Hack 2026 event configuration without invented deadline
        run: npm run db:seed

      - name: Execute 10,000-participant / 2,000-team scale seeder and capture SQL counts + EXPLAIN ANALYZE plans
        run: npm run db:seed:scale

      - name: Run PostgreSQL scale seed integration and idempotency verification against crewmesh_loadtest
        run: npm run test:scale

      - name: Build production shared and API bundles
        run: npm run build --workspace=@crewmesh/shared && npm run build --workspace=@crewmesh/api

      - name: Install official Grafana k6 load testing binary
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: v0.52.0

      - name: Start Fastify production server and execute two 100-VU 60-second k6 board benchmarks
        run: |
          npm run start --workspace=@crewmesh/api &
          API_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          K6_REPORT_DIR=reports/load-test npm run bench:board:k6
          cp reports/load-test/k6-summary.json reports/load-test/k6-summary-run1.json
          cp reports/load-test/k6-summary.txt reports/load-test/k6-summary-run1.txt
          K6_REPORT_DIR=reports/load-test npm run bench:board:k6
          kill $API_PID || true

      - name: Upload k6 benchmark and PostgreSQL EXPLAIN artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crewmesh-batch9-load-test-reports
          path: reports/load-test/
          retention-days: 30
